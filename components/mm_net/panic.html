<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Crash Report</title>

    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #eee;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding: 10px; text-decoration: none; cursor: pointer; color: #eee}
        .header img { width: 32px; height: 32px; }
        .header h1 { font-size: 1.5rem; margin: 0; }
        .title-link { text-decoration: none; color: inherit; }

        h2, h3 {
            font-size: 1.2rem;
            color: #888;
            margin: 0 0 15px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 30px;
            max-width: 800px;
        }

        dl {
            display: grid;
            grid-template-columns: 150px 1fr;
            column-gap: 30px;
            row-gap: 12px;
            margin: 0 0 20px 0;
            align-items: baseline;
        }
        dt { font-size: 0.9rem; color: #bbb; white-space: nowrap; }
        dd { margin: 0; color: #fff; font-family: monospace; background: #2a2a2a; padding: 4px 8px; border-radius: 4px; border: 1px solid #444;}

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        a { text-decoration: none; }

        table {
            border-collapse: collapse;
            font-size: 14px;
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #2a2a2a; color: #bbb; font-weight: bold; }
        code { font-family: monospace; font-weight: bold; color: #bbb; }

        .log-window {
            background: #000000;
            color: #ccc;
            font-family: monospace;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #333;
            overflow-x: auto;
            white-space: nowrap;
            line-height: 1.2;
        }
        .log-window p { margin: 2px 0; }

        .error { color: #ff5252; font-weight: bold; }
        .warning { color: #fb8c00; }
        .info { color: #4caf50; }

        .old-logs-container {
            margin-bottom: 15px;
        }

        .old-logs-container summary {
            background: #2a2a2a;
            color: #bbb;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #444;
            user-select: none;
            outline: none;
        }

        .old-logs-container summary:hover {
            background: #333333;
            color: #fff;
        }

        .old-logs-container[open] summary {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom: none;
        }

        .format-old-logs {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            opacity: 0.75;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="/favicon.ico" alt="Logo">
        <a href="/index.html" class="title-link">
            <h1>MiniMonitor</h1>
        </a>
    </header>

    <div class="card">
        <h2>System Crash Report</h2>
        /*PLACEHOLDER_ERROR_INFO*/
        <a href="coredump.bin" download="coredump.bin">
            <button type="button">Download Core Dump</button>
        </a>
    </div>

    <div class="card">
        <h3>Log History</h3>

        <details class="old-logs-container" id="old-logs-wrapper">
            <summary>View Old Logs</summary>
            <div class="log-window format-old-logs" id="old-logs-source">
                /*PLACEHOLDER_OLD_LOGS*/
            </div>
        </details>

        <div class="log-window" id="current-logs-target">
            /*PLACEHOLDER_LOGS*/
        </div>
    </div>

    /*PLACEHOLDER_AFTER_LOGS*/

    <div class="card">
        <h3>Error Code Reference</h3>
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Description / Cause</th>
                </tr>
            </thead>
            <tbody>
                /*PLACEHOLDER_ERROR_TABLE*/
            </tbody>
        </table>
    </div>
</body>
</html>
